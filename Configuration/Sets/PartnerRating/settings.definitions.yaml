categories:
  partnerrating: ~
  partnerrating.templates:
    parent: partnerrating
  partnerrating.resources:
    parent: partnerrating
  partnerrating.settings:
    parent: partnerrating

settings:
  plugin.tx_partnerrating_pi1.view.templateRootPath:
    type: string
    default: 'EXT:partner_rating/Resources/Private/Templates/'
    category: partnerrating.templates
  plugin.tx_partnerrating_pi1.view.partialRootPath:
    type: string
    default: 'EXT:partner_rating/Resources/Private/Partials/'
    category: partnerrating.templates
  plugin.tx_partnerrating_pi1.view.layoutRootPath:
    type: string
    default: 'EXT:partner_rating/Resources/Private/Layouts/'
    category: partnerrating.templates
  plugin.tx_partnerrating_pi1.settings.includeBootstrap:
    type: bool
    default: 0
    category: partnerrating.resources
  plugin.tx_partnerrating_pi1.settings.cssFile:
    type: string
    default: 'EXT:partner_rating/Resources/Public/Css/main.min.css'
    category: partnerrating.resources
  plugin.tx_partnerrating_pi1.settings.javaScriptFile:
    type: string
    default: 'EXT:partner_rating/Resources/Public/JavaScript/show.min.js'
