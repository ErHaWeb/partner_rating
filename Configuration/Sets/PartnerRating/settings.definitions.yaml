  plugin.tx_partnerrating_pi1.settings.partnerLabelFieldSplitString:
    type: string
    default: '|'
    category: partnerrating.settings
  plugin.tx_partnerrating_pi1.settings.mail.subject:
    type: string
    default: ''
    category: partnerrating.settings
  plugin.tx_partnerrating_pi1.settings.mail.from:
    type: string
    default: ''
    category: partnerrating.settings
  plugin.tx_partnerrating_pi1.settings.mail.to:
    type: string
    default: ''
    category: partnerrating.settings
