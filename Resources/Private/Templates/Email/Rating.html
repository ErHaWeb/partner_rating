<html data-namespace-typo3-fluid="true" lang="en" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:layout name="SystemEmail"/>
<f:section name="Title">{headline}</f:section>
<f:section name="Main">
    <f:if condition="{rating}">
        <strong>Rate Value:</strong> {rating.rateValue}<br>
        <strong>Partner:</strong> {rating.partner.title} ({rating.partner.partnerNr})<br>
        <f:if condition="{rating.reason}">
            <strong>Reasons:</strong><br>
            <ul>
                <f:for each="{rating.reason}" as="reason">
                    <li>
                        Reason: {reason.title}<br>
                        Description: {reason.description -> f:format.stripTags()}
                    </li>
                </f:for>
            </ul>
        </f:if>
        <f:if condition="{rating.reasonText}">
            Reason Text: {rating.reasonText}
        </f:if>
    </f:if>
</f:section>
</html>
