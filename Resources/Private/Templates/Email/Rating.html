<html data-namespace-typo3-fluid="true" lang="en" xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:layout name="SystemEmail" />
<f:section name="Title">{headline}</f:section>
<f:section name="Main">
    <f:if condition="{rating}">
        Rate Value: {rating.rateValue}<br>
        Partner: {rating.partner.title} ({rating.partner.partnerNr})<br>
        Reasons:<br>
        <f:for each="{rating.reason}" as="reason">
            Reason: {reason.title}<br>
            Description: {reason.description -> f:sanitize.html()}<br>
        </f:for>
        Reason Text: {rating.reasonText}
    </f:if>
</f:section>
</html>
